<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="陈艺 2025 作品集">
  <title>陈艺 · 2025 作品集</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #1c1b18;
      --accent: #b5472c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .badge {
      font-size: 13px;
      letter-spacing: 0.35em;
      color: #8a857a;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .sub {
      font-size: clamp(15px, 2.6vw, 20px);
      color: #6b665b;
      letter-spacing: 0.3em;
      margin-bottom: 48px;
    }
    a.open {
      display: inline-block;
      padding: 16px 52px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      letter-spacing: 0.2em;
      border-radius: 999px;
      transition: background 0.25s ease, transform 0.15s ease;
    }
    a.open:hover { background: var(--accent); transform: translateY(-2px); }
    .foot {
      position: fixed;
      bottom: 22px;
      font-size: 12px;
      color: #aaa59a;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div class="badge">PORTFOLIO · 2025</div>
  <h1>陈艺</h1>
  <div class="sub">设计作品集</div>
  <a class="open" href="portfolio.pdf" target="_blank">打开作品集</a>
  <div class="foot">CHEN YI · PORTFOLIO</div>
</body>
</html>
